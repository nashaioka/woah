<!DOCTYPE html>
<html>
<head>
    <title>CSS Detectives</title>
    <style>
        h2 {
            color: #8a2bcd;
            font-family: 'Georgia', serif;
        }
        #main-title {
            text-align: center;
            font-family: monospace, sans-serif;
        }
        .intro {
            background-color: lightgray;
            font-style: italic;
        }
    </style>
</head>
<body>
    <h1 id="main-title">My Awesome Website</h1>
    <p class="intro">This is the introduction to my site.</p>
    <h2>Chapter 1</h2>
    <p>Here is the first paragraph of content.</p>
    <p class="intro">I want this to look like the first intro paragraph.</p>
    <h2 class="chapter-title">Chapter 2</h2>
</body>
</html>
