<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Form Biodata Siswa</title>
  <style>
    body {
      background-color: #c4e3ef;
      font-family: Arial, Helvetica, sans-serif;
      margin: 0;
      padding: 0;
    }
    .form-container {
      background-color: white;
      max-width: 500px;
      margin: 50px auto;
      padding: 30px;
      border-radius: 20px;
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }
    input[type="text"],
    input[type="number"],
    input[type="date"],
    textarea {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 5px;
      box-sizing: border-box;
    }
    textarea {
      resize: vertical;
      height: 80px;
    }
    .submit-btn {
      margin-top: 20px;
      background-color: #4c96af;
      color: white;
      padding: 10px;
      border: none;
      border-radius: 5px;
      width: 100%;
      cursor: pointer;
    }
    .submit-btn:hover {
      background-color: #4580a0;
    }
  </style>
</head>
<body>
  <div class="form-container">
    <h1>Form Biodata</h1>
    <form>
      <label for="fullname">Your Fullname:</label>
      <input type="text" id="fullname" name="fullname" required>

      <label for="age">Age:</label>
      <input type="number" id="age" name="age" value="0" min="0" required>

      <label for="address">Address:</label>
      <textarea id="address" name="address" required></textarea>

      <label for="dob">Date of Birth:</label>
      <input type="date" id="dob" name="dob" placeholder="dd/mm/yyyy" required>

      <button type="submit" class="submit-btn">Submit</button>
    </form>
  </div>
</body>
</html>
